<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Akıllı Sera</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root{--bg:#f1f5f0;--card:#fff;--ink:#14281d;--mut:#5b6b60;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--acc:#14532d;--line:#dde5dc}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{background:var(--acc);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;margin:0}
  .chip{font-size:13px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
  .chip.on{background:#16a34a}.chip.off{background:#b91c1c}
  main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{margin:0 0 6px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .big{font-size:40px;font-weight:700}
  .big small{font-size:16px;color:var(--mut);font-weight:500}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .state{font-size:22px;font-weight:700}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
  .sub{font-size:12px;color:var(--mut);margin-top:4px}

  /* Dinamik Buton Stilleri */
  button{font:inherit;font-weight:600;border:2px solid transparent;border-radius:10px;padding:12px 16px;background:var(--acc);color:#fff;cursor:pointer;width:100%;transition:all .18s ease}
  button:active{transform:scale(0.97)}
  button.sec{background:#e5ece4;color:var(--ink)}
  button.btn-idle{background:#e5ece4;color:var(--mut);border-color:#d4dfd3}
  button.btn-on{background:#16a34a;color:#fff;box-shadow:0 3px 10px rgba(22,163,74,.28)}
  button.btn-off{background:#475569;color:#fff;box-shadow:0 3px 10px rgba(71,85,105,.25)}
  button.btn-pending{opacity:.65;transform:scale(0.98)}
  button:disabled{opacity:.4;cursor:not-allowed}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  input{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
  label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin:6px 0 12px}
  label.chk input{width:auto;margin:0}
  #err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:8px}
  .hide{display:none}
  a.out{display:block;text-align:center;font-size:13px;color:var(--mut);margin-top:6px;cursor:pointer}
</style>
</head>
<body>
<header><h1>🌱 Akıllı Sera</h1><span id="baglanti" class="chip">Bağlı değil</span></header>
<main>

  <section id="giris" class="card">
    <h2>Giriş</h2>
    <input id="kul" placeholder="Kullanıcı adı" autocomplete="username">
    <input id="sif" type="password" placeholder="Şifre" autocomplete="current-password">
    <label class="chk"><input type="checkbox" id="hatirla"> Bu cihazda hatırla</label>
    <div id="err"></div>
    <button id="btnBaglan">Bağlan</button>
  </section>

  <section id="panel" class="hide">
    <div class="card">
      <h2>Cihaz</h2>
      <div class="state" id="cihazDurum">—</div>
      <div class="sub" id="guncel">Veri bekleniyor…</div>
    </div>

    <div class="card">
      <h2>TDS (iletkenlik)</h2>
      <div class="big"><span id="tds">—</span> <small>ppm</small></div>
    </div>

    <div class="row">
      <div class="card">
        <h2>Su seviyesi</h2>
        <div class="state" id="su">—</div>
      </div>
      <div class="card">
        <h2>Pompa</h2>
        <div class="state" id="pompa">—</div>
        <div class="sub" id="pompaHata"></div>
      </div>
    </div>

    <div class="card">
      <h2>Makine (Tapo Priz)</h2>
      <div class="state" id="makineDurumText">—</div>
      <div class="sub" id="makineAlt">Durum bilgisi bekleniyor…</div>
      <div class="btns">
        <button id="makineAc" class="btn-idle">Aç</button>
        <button id="makineKapat" class="btn-idle">Kapat</button>
      </div>
    </div>

    <div class="card">
      <h2>Test: kart LED'i</h2>
      <div class="btns">
        <button id="ledAc" class="btn-idle">LED aç</button>
        <button id="ledKapat" class="btn-idle">LED kapat</button>
      </div>
    </div>

    <a class="out" id="cikis">Çıkış yap</a>
  </section>
</main>

<script>
const HOST = "d8a01ed0.ala.eu-central-1.emqxsl.com";
const WSS_PORT = 8084;
const CIHAZ = "sera01";
const T = s => "sera/" + CIHAZ + "/" + s;

const $ = id => document.getElementById(id);
let client = null;

function saklaOku(){
  try { return JSON.parse(localStorage.getItem("sera_giris") || "null"); } catch(e){ return null; }
}
function saklaYaz(v){
  try { v ? localStorage.setItem("sera_giris", JSON.stringify(v)) : localStorage.removeItem("sera_giris"); } catch(e){}
}

function baglantiChip(metin, sinif){
  const c = $("baglanti");
  c.textContent = metin;
  c.className = "chip " + (sinif || "");
}

function butonDurumGuncelle(acikMi){
  const btnAc = $("makineAc");
  const btnKapat = $("makineKapat");
  const txt = $("makineDurumText");
  const alt = $("makineAlt");

  btnAc.classList.remove("btn-pending");
  btnKapat.classList.remove("btn-pending");

  if (acikMi){
    btnAc.className = "btn-on";
    btnAc.textContent = "Açık ✓";
    btnKapat.className = "btn-idle";
    btnKapat.textContent = "Kapat";
    txt.textContent = "AÇIK";
    txt.className = "state ok";
    alt.textContent = "Priz aktif, enerji veriliyor";
  } else {
    btnAc.className = "btn-idle";
    btnAc.textContent = "Aç";
    btnKapat.className = "btn-off";
    btnKapat.textContent = "Kapalı ✓";
    txt.textContent = "KAPALI";
    txt.className = "state bad";
    alt.textContent = "Priz kapalı";
  }
}

function ledButonGuncelle(acikMi){
  $("ledAc").className = acikMi ? "btn-on" : "btn-idle";
  $("ledKapat").className = acikMi ? "btn-idle" : "btn-off";
}

function baglan(kul, sif){
  $("err").textContent = "";
  baglantiChip("Bağlanıyor…");
  if (client) { try { client.end(true); } catch(e){} }

  client = mqtt.connect("wss://" + HOST + ":" + WSS_PORT + "/mqtt", {
    username: kul,
    password: sif,
    clientId: "panel-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 4000,
    connectTimeout: 10000
  });

  client.on("connect", () => {
    baglantiChip("Bağlı", "on");
    $("giris").classList.add("hide");
    $("panel").classList.remove("hide");
    client.subscribe("sera/" + CIHAZ + "/#", { qos: 1 });
    if ($("hatirla").checked) saklaYaz({kul, sif});
  });
  client.on("reconnect", () => baglantiChip("Yeniden bağlanıyor…"));
  client.on("close", () => baglantiChip("Bağlı değil"));
  client.on("error", e => {
    $("err").textContent = "Bağlantı hatası: kullanıcı adı/şifre veya internet kontrol edilmeli.";
    $("giris").classList.remove("hide");
    $("panel").classList.add("hide");
    baglantiChip("Hata", "off");
  });
  client.on("message", (konu, veri) => {
    const m = veri.toString().trim();
    const k = konu.replace("sera/" + CIHAZ + "/", "");
    ekranGuncelle(k, m);
  });
}

function ekranGuncelle(k, m){
  if (k === "durum"){
    $("cihazDurum").textContent = m === "online" ? "Çevrimiçi" : "Çevrimdışı";
    $("cihazDurum").className = "state " + (m === "online" ? "ok" : "bad");
  } else if (k === "tds"){
    $("tds").textContent = m;
    $("guncel").textContent = "Son veri: " + new Date().toLocaleTimeString("tr-TR");
  } else if (k === "su_seviyesi"){
    $("su").textContent = m === "1" ? "Yeterli" : "DÜŞÜK";
    $("su").className = "state " + (m === "1" ? "ok" : "bad");
  } else if (k === "pompa_durum"){
    $("pompa").textContent = m === "1" ? "Çalışıyor" : "Kapalı";
    $("pompa").className = "state " + (m === "1" ? "warn" : "");
  } else if (k === "pompa_hata"){
    const t = {ok:"", zaman_asimi:"Zaman aşımı uyarısı", kilitli:"Pompa kilitli, kontrol et"};
    $("pompaHata").textContent = t[m] ?? m;
    $("pompaHata").className = "sub " + (m === "ok" ? "" : "bad");
  } else if (k === "makine_durum"){
    butonDurumGuncelle(m === "1");
  } else if (k === "led_komut"){
    ledButonGuncelle(m === "1");
  }
}

function yayinla(konu, deger){
  if (client && client.connected) client.publish(T(konu), deger, { qos: 1, retain: true });
}

$("btnBaglan").onclick = () => {
  const kul = $("kul").value.trim(), sif = $("sif").value;
  if (!kul || !sif) { $("err").textContent = "Kullanıcı adı ve şifre gerekli."; return; }
  baglan(kul, sif);
};

$("makineAc").onclick = () => {
  $("makineAc").classList.add("btn-pending");
  $("makineAlt").textContent = "Açma komutu gönderiliyor…";
  yayinla("makine_komut", "1");
};

$("makineKapat").onclick = () => {
  $("makineKapat").classList.add("btn-pending");
  $("makineAlt").textContent = "Kapatma komutu gönderiliyor…";
  yayinla("makine_komut", "0");
};

$("ledAc").onclick = () => {
  ledButonGuncelle(true);
  yayinla("led_komut", "1");
};

$("ledKapat").onclick = () => {
  ledButonGuncelle(false);
  yayinla("led_komut", "0");
};

$("cikis").onclick = () => {
  saklaYaz(null);
  if (client) client.end(true);
  location.reload();
};

const kayit = saklaOku();
if (kayit) { $("kul").value = kayit.kul; $("sif").value = kayit.sif; $("hatirla").checked = true; baglan(kayit.kul, kayit.sif); }
</script>
</body>
</html>
